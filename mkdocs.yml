site_name: mpv-object-audio
site_description: An installer and wrapper that gives a Linux machine a self-contained live Dolby Atmos / DTS:X player.
repo_url: https://github.com/praveenchandrahas/mpv-object-audio
repo_name: praveenchandrahas/mpv-object-audio
docs_dir: docs
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle: {icon: material/brightness-4, name: Switch to light mode}
  features: [navigation.instant, navigation.sections, navigation.top, toc.integrate, content.code.copy]
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Install: install.md
  - Usage: usage.md
  - Build & debugging log: omniphony-debugging.md
